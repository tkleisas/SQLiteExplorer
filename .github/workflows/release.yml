name: Release

# Trigger a release build by pushing a version tag, e.g.:
#   git tag v1.2.3
#   git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release and upload assets

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls lib/AvaloniaVirtualDataGrid
          fetch-depth: 0          # full history so GitInfo can resolve the commit

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (${{ matrix.rid }})
        shell: bash
        run: >
          dotnet publish src/SQLiteExplorer/SQLiteExplorer.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Strip debug symbols
        shell: bash
        run: rm -f publish/${{ matrix.rid }}/*.pdb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* `
            -DestinationPath "SQLiteExplorer-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "publish/${{ matrix.rid }}/SQLiteExplorer" || true
          tar -czf "SQLiteExplorer-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz" \
            -C "publish/${{ matrix.rid }}" .

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SQLiteExplorer-${{ steps.version.outputs.version }}-*.zip
            SQLiteExplorer-${{ steps.version.outputs.version }}-*.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
